name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target Live32Channel_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Live32-Channel-Windows-VST3
          path: build/Live32Channel_artefacts/Release/VST3/**
          if-no-files-found: error
